name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source files
        run: python -m py_compile app.py train_model.py

      - name: Validate dataset contract
        run: |
          python - <<'PY'
          import pandas as pd

          required_columns = {
              "longitude",
              "latitude",
              "housing_median_age",
              "total_rooms",
              "total_bedrooms",
              "population",
              "households",
              "median_income",
              "median_house_value",
              "ocean_proximity",
          }

          data = pd.read_csv("housing.csv")
          missing = required_columns.difference(data.columns)
          if missing:
              raise SystemExit(f"Missing required columns: {sorted(missing)}")
          if data.empty:
              raise SystemExit("Dataset is empty")
          PY
